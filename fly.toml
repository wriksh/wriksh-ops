# Fly.io configuration for wriksh-ops.
#
# Deploys a single always-on machine that runs:
#   - Next.js admin UI on port 3000
#   - wrikshbot gateway + node-cron (in-process via Dockerfile CMD)
#
# Free tier is sufficient for development; `auto_stop_machines` lets the
# instance sleep when idle, waking on the next HTTP request.

app = "wriksh-ops"
primary_region = "bom"   # Mumbai — closest to the team

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  PORT = "3000"
  DISCORD_CRON_TZ = "Asia/Kolkata"
  DISCORD_CRON_HOUR = "8"
  DISCORD_CRON_MINUTE = "0"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

# Secrets — set these via `fly secrets set`, NOT in this file:
#   fly secrets set DISCORD_BOT_TOKEN=... DISCORD_GUILD_ID=... \
#       DISCORD_CRON_SECRET=... WRIKSHBOT_ALLOWED_USER_IDS=... \
#       MINIMAX_API_KEY=... MONGODB_URI=...
